# Builds the plugin and publishes a GitHub release when a version tag is pushed.
# The tag must equal the "version" in manifest.json, e.g. 3.19.0 (no "v" prefix).
name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write      # create the release
  id-token: write      # sign the build attestation
  attestations: write  # store the build attestation

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build

      # Lets anyone verify that the release files were built from this repository:
      #   gh attestation verify main.js --repo <github-user>/<repository>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            main.js manifest.json styles.css
